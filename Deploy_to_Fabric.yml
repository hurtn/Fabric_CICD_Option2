trigger:
  branches:
    include:
      - test
      - prod

variables:
  - group: Fabric_Deployment_Group_S

stages:
  - stage: DeployToFabric
    displayName: "Deploy to Fabric Workspace"
    jobs:
      - job: Deployment
        displayName: "Deploy Resources"
        pool:
          name: Azure Pipelines
        steps:

          # Use Python Version 3.12
          - task: UsePythonVersion@0
            inputs:
              versionSpec: '3.12'
              addToPath: true
            displayName: "Set up Python Environment"

          # Install Dependencies
          - script: |
              python -m pip install --upgrade pip
              pip install colorama fabric-cicd 
            displayName: "Install Fabric CICD Library"

          # Debug Print Variables (for Troubleshooting)
          - script: |
              echo "ClientID: $(azclientid)"
              echo "TenantID: $(aztenantid)"
            displayName: "Print Variables for Debugging"

          # Run PowerShell script for authentication & deployment 
          - task : PowerShell@2 
            inputs :
                targetType: 'filePath' 
                filePath: 'scripts/deploy/deploy_to_fabric.ps1' 
            env:  
              AZURE_APP_ID: $(azclientid) 
              AZURE_SECRET: $(azspsecret) 
              AZURE_TENANT_ID: $(aztenantid)  
            displayName: "Run Deployment via PowerShell"  
